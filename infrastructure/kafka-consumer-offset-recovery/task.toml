version = "1.0"

artifacts = [
  "/app/data/consumer_config.json",
  "/app/data/recovery_state.json",
  "/app/data/workloads.json",
  "/app/data/commit_journal.json",
  "/app/data/rebalance_state.json"
]

[metadata]
authors = [
    { name = "mohamed ahmed", email = "engmohamedelshrbeny@gmail.com" }
]
author_organization = "Forge Bench"
difficulty_explanation = "A distributed infrastructure recovery incident in which active assignment metadata, restart metadata, checkpoint offsets, processing history, durable commit evidence, and rebalance state disagree. Correct repair requires distinguishing processed from durably committed offsets and correlating generation and assignment epoch across independent lifecycle artifacts. The agent must preserve topology, workload accounting, and recovery policy while avoiding destructive offset reset shortcuts."
solution_explanation = "The reference solution uses the active assignment and durable commit journal as authoritative evidence, repairs generation/epoch and restart policy, and reconstructs checkpoint recovery offsets from committed progress without rewriting historical processing state."
verification_explanation = "The verifier independently checks topology, manual commit semantics, active generation/epoch, rebalance consistency, durable commit journal, checkpoint offsets, processed-history preservation, ownership, workload preservation, and anti-reset constraints. Hidden tests specifically exercise partial progress and authoritative commit evidence."
category = "infrastructure"
tags = ["kafka","infrastructure","distributed-systems","consumer-recovery","offset-management","crash-recovery","backend"]
expert_time_estimate_hours = 1.0

[verifier]
timeout_sec = 120
collect = []

[verifier.env]

[agent]
timeout_sec = 600

[environment]
network_mode = "none"
build_timeout_sec = 600
os = "linux"
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0

[environment.env]
[solution.env]
