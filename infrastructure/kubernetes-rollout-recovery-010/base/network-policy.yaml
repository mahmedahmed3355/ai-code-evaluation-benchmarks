apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inference-api-network-policy
spec:
  podSelector:
    matchLabels:
      app: inference-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
  egress:
    - to:
        - namespaceSelector: {}
