version = "1.0"
[metadata]
author_name = "Mohamed Ahmed"
author_email = "engmohamedelshrbeny@gmail.com"
author_organization = "Forge Bench"
difficulty_explanation = "The candidate must harden a production container build while preserving application behavior. Correctness spans image user identity, filesystem ownership, package pinning, secret-safe environment handling, health checks, read-only runtime assumptions, and runtime capability policy."
solution_explanation = "The reference repair produces a non-root, deterministic container configuration with explicit runtime contract and no secret material in image layers."
verification_explanation = "The verifier independently parses the resulting Dockerfile and runtime manifest, builds the image, executes the service as a non-root user, checks filesystem ownership, package reproducibility, secret absence, health behavior, and hostile runtime constraints."
category = "security"
tags = ["docker", "container-security", "hardening", "supply-chain", "least-privilege", "runtime-security"]
expert_time_estimate_hours = 2
relevant_experience = "I build and evaluate containerized backend, infrastructure, CUDA/GPU, and AI-system engineering tasks using Harbor and Terminal-Bench workflows."

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = false
