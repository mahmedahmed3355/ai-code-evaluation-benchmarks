# Benchmark profile configuration
# These settings describe the workload used by the validation workflow.

PROFILE_NAME=benchmark

INPUT_SIZE=1048576
WARMUP_RUNS=3
MEASURED_RUNS=10

# Supported optimization profile.
# The build system should inherit the primary optimization contract
# unless a supported profile explicitly overrides a value.
OPT_PROFILE=release

# Artifact validation requirements.
REQUIRE_LTO=1
REQUIRE_FAST_MATH=1
REQUIRE_VECTOR_WIDTH=4
