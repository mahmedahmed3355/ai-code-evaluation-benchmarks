version = "1.0"

artifacts = [
    "/app/build/resolved_config.txt",
    "/app/build/execution_plan.txt",
    "/app/artifacts/kernel_build.artifact",
    "/app/reports/benchmark.txt",
    "/app/configs/build.conf",
    "/app/configs/release.profile",
    "/app/configs/benchmark.conf",
    "/app/configs/local.override",
    "/app/datasets/memory_pool.csv",
]

[metadata]
author_name = "Mohamed"
author_email = "engmohamedelshrbeny@gmail.com"
difficulty = "hard"
category = "software_engineering"
tags = [
    "cuda",
    "gpu",
    "memory-management",
    "memory-pool",
    "stream-ordering",
    "memory-reuse",
    "performance-regression",
    "configuration-debugging",
    "performance-optimization"
]
expert_time_estimate_min = 30.0
junior_time_estimate_min = 75.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[verifier.environment]
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = false

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = false
mcp_servers = []

[verifier.env]

[solution.env]
