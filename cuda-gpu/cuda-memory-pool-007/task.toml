version = "1.0"

artifacts = [
    "/app/build/resolved_config.txt",
    "/app/build/config_provenance.txt",
    "/app/build/execution_plan.txt",
    "/app/artifacts/kernel_build.artifact",
    "/app/artifacts/kernel_build.provenance",
    "/app/reports/benchmark.txt",
    "/app/configs/build.conf",
    "/app/configs/release.profile",
    "/app/configs/benchmark.conf",
    "/app/configs/local.override",
    "/app/datasets/memory_pool.csv",
    "/app/history/build_history.csv",
]

[metadata]
author_name = "Mohamed Ahmed"
author_email = "engmohamedelshrbeny@gmail.com"
organization = "Forge Bench"
difficulty = "hard"
category = "software_engineering"
tags = [
    "cuda",
    "gpu",
    "memory-management",
    "memory-pool",
    "stream-ordering",
    "memory-reuse",
    "performance-regression",
    "configuration-debugging",
    "performance-optimization",
    "configuration-provenance",
]
expert_time_estimate_min = 35.0
junior_time_estimate_min = 90.0
difficulty_rationale = "Requires diagnosing configuration precedence and interacting allocator, reuse, synchronization, and chunking effects across multiple workloads while preserving generated-artifact consistency and independent performance checks."
solution_rationale = "The intended repair restores the coherent stream-ordered memory-pool strategy at the regression layer and then regenerates all derived outputs through the normal validation workflow."
verification_rationale = "The verifier independently checks workload preservation, configuration provenance, effective strategy, per-workload and aggregate budgets, generated artifact consistency, provenance digests, historical regression evidence, and benchmark/report consistency."

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[verifier.environment]
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = false

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = false
mcp_servers = []

[verifier.env]

[solution.env]
