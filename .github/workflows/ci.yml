name: Benchmark Portfolio CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Tests and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Fresh clone bootstrap and repository smoke check
        run: |
          rm -rf .venv
          make smoke

      - name: Dependency audit
        run: uv run pip-audit

  iac-checks:
    name: Docker and Kubernetes Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "**/Dockerfile"
          recursive: true
          failure-threshold: error

      - name: Install kubeconform
        run: |
          curl -L -o kubeconform.tar.gz             https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Run Trivy config scan for CUDA task environments
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: cuda-gpu
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Validate Kubernetes manifests
        run: |
          find infrastructure/kubernetes-rollout-recovery-010 \
            \( -name "*.yaml" -o -name "*.yml" \) \
            -print0 | xargs -0 -r kubeconform -strict -summary
