name: Benchmark Portfolio CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Tests and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install reproducible dependencies
        run: python -m pip install -r requirements.lock

      - name: Run repository tests
        run: python -m pytest tests/ -v

      - name: Run lint
        run: python -m ruff check .

      - name: Run type checks
        run: python -m mypy scripts tests

      - name: Dependency audit
        run: python -m pip_audit -r requirements-dev.txt

      - name: Validate benchmark tasks
        run: make validate-all

  iac-checks:
    name: Docker and Kubernetes Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Dockerfile presence
        run: |
          test "$(find . -type f -name Dockerfile | wc -l)" -gt 0

      - name: Validate Kubernetes manifests
        run: |
          python - <<'PY2'
          from pathlib import Path

          manifests = list(
              Path(
                  "infrastructure/kubernetes-rollout-recovery-010"
              ).rglob("*.yaml")
          ) + list(
              Path(
                  "infrastructure/kubernetes-rollout-recovery-010"
              ).rglob("*.yml")
          )

          if not manifests:
              raise SystemExit("No Kubernetes manifests found")

          print("Found Kubernetes manifests:")
          for manifest in manifests:
              print(manifest)
          PY2
