name: Benchmark Portfolio CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Tests and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run pytest
        run: uv run python -m pytest tests/ -v

      - name: Run test coverage
        run: |
          uv run python -m pytest tests/ \
            --cov=scripts.logging_config \
            --cov=scripts.validation_metrics \
            --cov=scripts.validate_tasks \
            --cov=scripts.task_isolation \
            --cov=scripts.task_manifest \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Run Ruff lint
        run: uv run python -m ruff check .

      - name: Run MyPy type checking
        run: uv run python -m mypy scripts tests

      - name: Validate benchmark tasks
        run: uv run python -m scripts.validate_tasks

      - name: Run task isolation checks
        run: uv run python -m scripts.task_isolation

      - name: Validate task manifests
        run: uv run python -m scripts.task_manifest

      - name: Dependency audit
        run: uv run pip-audit

      - name: Check task dependency pinning
        run: uv run python -m scripts.check_task_deps

      - name: Fresh clone bootstrap and smoke check
        run: |
          rm -rf .venv
          make smoke

  iac-checks:
    name: Docker and Kubernetes Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "**/Dockerfile"
          recursive: true
          failure-threshold: none
          no-fail: true

      - name: Install kubeconform
        run: |
          curl -L -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Run Trivy config scan for repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Validate Kubernetes security policy
        run: uv run python -m scripts.validate_k8s_security

      - name: Validate Kubernetes manifests
        run: |
          find infrastructure/kubernetes-rollout-recovery-010 \
            \( -name "*.yaml" -o -name "*.yml" \) \
            ! -name "kustomization.yaml" \
            -print0 | xargs -0 -r kubeconform -strict -summary

          kubectl kustomize infrastructure/kubernetes-rollout-recovery-010/base >/dev/null
