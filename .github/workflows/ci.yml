name: Validate Benchmark Portfolio

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate Task Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate benchmark tasks
        run: python scripts/validate_tasks.py
