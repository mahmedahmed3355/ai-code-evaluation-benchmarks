[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[project]
name = "ai-code-evaluation-benchmarks"
version = "0.1.0"
description = "Terminal-Bench style AI coding agent evaluation task portfolio"
requires-python = ">=3.12"
dependencies = []

# Benchmark task environments own their runtime dependencies.
# Repository-level development and validation tooling is declared here.
[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==6.3.0",
    "ruff==0.12.11",
    "mypy==1.18.2",
    "pip-audit==2.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
