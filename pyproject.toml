[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[project]
name = "ai-code-evaluation-benchmarks"
version = "0.1.0"
description = "Terminal-Bench style AI coding agent evaluation task portfolio"
requires-python = ">=3.12"
dependencies = []

# Benchmark task environments own their runtime dependencies.
# Repository-level development and validation tooling is declared here.

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.12.11",
    "mypy==1.18.2",
    "pip-audit==2.8.0",
    "pyyaml==6.0.2",
    "types-pyyaml>=6.0.12.20260815",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
