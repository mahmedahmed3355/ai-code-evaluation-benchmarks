[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-evaluation-benchmarks"
version = "0.1.0"
description = "Terminal-Bench style AI coding agent evaluation task portfolio"
requires-python = ">=3.12"

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov>=6,<7",
    "ruff==0.9.10",
    "mypy==1.15.0",
    "pip-audit==2.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
